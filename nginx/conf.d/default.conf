#Virtual host configuration for the application.

server {
    listen 80;

    server_name localhost;

    # Disable access to camera, microphone and geolocation
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";

    # Maximum upload size
    client_max_body_size 20M;

    # Log all requests to Docker logs
    access_log /dev/stdout;

    # Log warnings and errors to Docker logs
    error_log /dev/stderr warn;

    location /static/ {
        alias /app/src/staticfiles/;

        # Cache static files for 30 days
        expires 30d;

        # Allow browsers and proxies to cache static files
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/src/media/;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;

        # Preserve the original Host header
        proxy_set_header Host $host;

        # Forward the client's real IP address
        proxy_set_header X-Real-IP $remote_addr;

        # Preserve the full proxy chain
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Forward the original protocol (HTTP or HTTPS)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:5173;

        # Use HTTP/1.1 to support WebSockets (required by Vite Hot Module Reload)
        proxy_http_version 1.1;

         # Preserve the original Host header
        proxy_set_header Host $host;

        # Allow WebSocket protocol upgrades
        proxy_set_header Upgrade $http_upgrade;

        # Tell the upstream server to upgrade the connection
        proxy_set_header Connection "upgrade";

        # Preserve the full proxy chain
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Forward the original protocol (HTTP or HTTPS)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
