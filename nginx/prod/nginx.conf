
# Global Nginx configuration.
# Defines the core behaviour of the Nginx server.

# System user
user nginx;

# Number of cores
# (4-core CPU -> it creates 4 workers)
worker_processes auto;

events {
    # Number of connections per worker
    # (1024, 4 * 1024 -> 4096 simultaneous users)
    worker_connections 1024;
}

http {
    # List of types for nginx responses
    # (Content-Type: text/css, image/png, application/javascript...)
    include       /etc/nginx/mime.types;

    # Default Content-Type if the type is not in mime.types
    default_type  application/octet-stream;

    sendfile on;

    # Hide the Nginx version
    server_tokens off;

    # Enable Gzip compression
    gzip on;
    # adds HTTP header -> Vary: Accept-Encoding
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;

    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Read the files *.conf located in /conf.d
    include /etc/nginx/conf.d/*.conf;
}
