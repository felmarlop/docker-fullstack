services:
  backend:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    container_name: ${COMPOSE_PROJECT_NAME}-backend

    restart: unless-stopped

    # Inject environment variables
    env_file:
      - .env.production.local

    build:
      # Send the content in /backend to daemon
      context: ./backend
      dockerfile: Dockerfile.prod

    expose:
      - "${BACKEND_PORT}"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      # Static and media files with named volumes (no bind mounts)
      # Read-write access is required for collectstatic and user uploads (no :ro)
      - static_data:/app/src/staticfiles
      - media_data:/app/src/media

    # Wait until Gunicorn is serving HTTP requests
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; \
           req = urllib.request.Request('http://localhost:${BACKEND_PORT}/api/ping/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: ${COMPOSE_PROJECT_NAME}-nginx:prod
    container_name: ${COMPOSE_PROJECT_NAME}-nginx

    restart: unless-stopped

    ports:
      - "${NGINX_HOST_PORT}:${NGINX_PORT}"

    build:
      # Build the frontend and include the compiled assets in the Nginx image
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_API_URL: ${VITE_API_URL}
        VITE_GITHUB_CLIENT_ID: ${VITE_GITHUB_CLIENT_ID}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
      context: ./frontend
      dockerfile: Dockerfile.prod

    volumes:
      # :ro -> read-only
      # Nginx configuration
      - ./nginx/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod/conf.d:/etc/nginx/conf.d:ro

      # Static and media files with named volumes (no bind mounts)
      - static_data:/app/src/staticfiles:ro
      - media_data:/app/src/media:ro

    depends_on:
      backend:
        condition: service_healthy

  celery-worker:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    container_name: ${COMPOSE_PROJECT_NAME}-worker

    restart: unless-stopped

    # Inject environment variables
    env_file:
      - .env.production.local

    environment:
      # Avoid running periodic tasks, migrations and collectstatic again
      SKIP_INITIALIZATION: "true"

    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    command: celery -A app worker --loglevel=info

    depends_on:
      backend:
        condition: service_healthy

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

  celery-beat:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    container_name: ${COMPOSE_PROJECT_NAME}-beat

    restart: unless-stopped

    # Inject environment variables
    env_file:
      - .env.production.local

    environment:
      # Avoid running periodic tasks, migrations and collectstatic again
      SKIP_INITIALIZATION: "true"

    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    command: celery -A app beat --loglevel=info

    depends_on:
      backend:
        condition: service_healthy

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: ${COMPOSE_PROJECT_NAME}-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    expose:
      - "${POSTGRES_PORT}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # Check whether PostgreSQL is ready
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]

      # Check every 3 seconds
      interval: 3s

      # Maximum time for each check
      timeout: 5s

      # Retry 5 times
      retries: 5

      # Grace period while PostgreSQL starts
      start_period: 10s

  redis:
    image: redis:7.4.9-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis

    restart: unless-stopped

    expose:
      - "${REDIS_PORT}"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  static_data:
  media_data:
  postgres_data:
