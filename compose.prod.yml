services:
  backend:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    container_name: ${COMPOSE_PROJECT_NAME}-backend

    restart: unless-stopped

    # Inject environment variables
    env_file:
      - .env

    build:
      # Send the content in /backend to daemon
      context: ./backend
      dockerfile: Dockerfile.prod

    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    # Wait until Gunicorn is serving HTTP requests
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ping/')",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:stable-alpine3.24
    container_name: ${COMPOSE_PROJECT_NAME}-nginx

    restart: unless-stopped

    ports:
      - "${NGINX_PORT}:80"

    volumes:
      # :ro -> read-only
      # Nginx configuration
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

      # Static and media files
      - ./backend/src/staticfiles:/app/src/staticfiles:ro
      - ./backend/src/media:/app/src/media:ro

    depends_on:
      backend:
        condition: service_healthy

  celery-worker:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    container_name: ${COMPOSE_PROJECT_NAME}-worker

    restart: unless-stopped

    # Inject environment variables
    env_file:
      - .env

    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    command: celery -A app worker --loglevel=info

    depends_on:
      backend:
        condition: service_healthy

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

  celery-beat:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    container_name: ${COMPOSE_PROJECT_NAME}-beat

    restart: unless-stopped

    # Inject environment variables
    env_file:
      - .env

    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    command: celery -A app beat --loglevel=info

    depends_on:
      backend:
        condition: service_healthy

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: ${COMPOSE_PROJECT_NAME}-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # Check whether PostgreSQL is ready
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]

      # Check every 5 seconds
      interval: 3s

      # Maximum time for each check
      timeout: 5s

      # Retry 5 times
      retries: 5

      # Grace period while PostgreSQL starts
      start_period: 10s

  redis:
    image: redis:7.4.9-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis

    restart: unless-stopped

    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
