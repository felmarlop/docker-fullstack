services:
  backend:
    image: docker-fullstack-backend:dev
    container_name: backend

    build:
      # Send the content in /backend to daemon
      context: ./backend

    ports:
      - "${BACKEND_PORT}:8000"

    depends_on:
      - postgres

    volumes:
      # Host: /backend
      # Container: /app (defined in Dockerfile)
      - ./backend:/app
  
  postgres:
    image: postgres:17
    container_name: postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    
    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  
volumes:
  postgres_data: